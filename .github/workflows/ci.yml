name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PSR-12 and PHP tests
    runs-on: ubuntu-latest

    container:
      image: rsanjose/php851:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PHP version
        run: php -v

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer validation
        run: composer validate --no-check-publish

      - name: PHPCS (PSR-12)
        run: composer lint

      - name: PHP tests
        run: |
          composer test:runtime
          composer test:cds-read
          composer test:listget
