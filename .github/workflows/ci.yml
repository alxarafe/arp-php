name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PSR-12 and PHP tests
    runs-on: ubuntu-latest

    container:
      image: rsanjose/php851:latest
      options: --user root

    env:
      ARP_CONTRACT_PATH: ${{ github.workspace }}/arp-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned contract
        uses: actions/checkout@v4
        with:
          repository: alxarafe/arp-contract
          path: arp-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Pin contract commit
        run: git -C arp-contract checkout --detach "$(cat contract.ref)"

      - name: PHP version
        run: php -v

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer validation
        run: composer validate --no-check-publish

      - name: PHPCS (PSR-12)
        run: composer lint

      - name: PHP tests
        run: composer test
