name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Generic core, codecs and PSR-12
    runs-on: ubuntu-latest

    container:
      image: rsanjose/php851:latest
      options: --user root

    env:
      ARP_CONTRACT_PATH: ${{ github.workspace }}/arp-contract
      ARP_WRITE_CONTRACT_PATH: ${{ github.workspace }}/write-contract
      ARP_CORE_REPORT: ${{ github.workspace }}/core-contract-report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned contract
        uses: actions/checkout@v4
        with:
          repository: alxarafe/arp-contract
          path: arp-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Pin contract commit
        run: git -C arp-contract checkout --detach "$(cat contract.ref)"

      - name: Pin write contract separately
        run: git -C arp-contract worktree add --detach ../write-contract "$(cat write-contract.ref)"

      - name: PHP version
        run: php -v

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer validation
        run: composer validate --no-check-publish

      - name: PHPCS (PSR-12)
        run: composer lint

      - name: Generic PHP tests (known gaps explicitly reported as nonconformant)
        run: composer test
      - name: Generic conformance matrix (not SQL evidence)
        run: cat core-contract-report.json

  crud-mariadb:
    name: MariaDB adapter and integrated tests
    runs-on: ubuntu-latest
    container:
      image: rsanjose/php851:latest
      options: --user root
    services:
      db:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: arpcds
          MARIADB_ROOT_PASSWORD: ${{ github.run_id }}-crud-isolated
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s --health-timeout=5s --health-retries=60
    env:
      ARP_WRITE_CONTRACT_PATH: ${{ github.workspace }}/arp-write-contract
      ARP_DB_PASSWORD: ${{ github.run_id }}-crud-isolated
      ARP_WRITE_REPORT: ${{ github.workspace }}/crud-mariadb-report.json
      ARP_INTEGER_REPORT: ${{ github.workspace }}/integer-mariadb-report.json
      ARP_CRUD_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alxarafe/arp-contract
          path: arp-write-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed write contract
        run: git -C arp-write-contract checkout --detach "$(cat write-contract.ref)"
      - name: Install existing dependencies
        run: composer install --no-interaction --no-progress
      - name: Mark isolated service database
        run: |
          php -r '$c = new PDO("mysql:host=db;dbname=arpcds", "root", getenv("ARP_DB_PASSWORD"));
          $c->exec("CREATE TABLE __arp_crud_test_owner(token varchar(64))");
          $s = $c->prepare("INSERT INTO __arp_crud_test_owner VALUES (?)");
          $s->execute([getenv("ARP_CRUD_RUN_TOKEN")]);'
      - name: Real transactions, shared vectors and concurrent sessions
        run: php providers/tests/crud-mariadb.php
      - name: Exact INTEGER, unsigned 64-bit CRUD and cursor evidence
        run: php providers/tests/integer-mariadb.php
      - name: Conformance matrix
        run: |
          cat crud-mariadb-report.json
          cat integer-mariadb-report.json