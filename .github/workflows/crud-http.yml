name: Demo CRUD HTTP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-mariadb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alxarafe/arp-contract
          path: arp-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Pin contract
        run: git -C arp-contract checkout --detach "$(cat write-contract.ref)"
      - name: Real HTTP and MariaDB regression
        env:
          ARP_WRITE_CONTRACT_PATH: ${{ github.workspace }}/arp-contract
        run: python3 demo/crud-run check
      - name: Stop owned resources
        if: always()
        run: python3 demo/crud-run stop
